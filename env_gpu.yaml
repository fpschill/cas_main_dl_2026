name: cas_main_dl_gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - jupyterlab_widgets
  - ipywidgets
  - matplotlib
  # use OpenBLAS instead of MKL (on Windows, MKL with conda-forge's llvm-openmp crashes numpy)
  - libblas=*=*openblas
  - pip:
    # PyTorch with CUDA 13.2 (CUDA and cuDNN come with the wheels, only an NVIDIA driver >= 595 is needed)
    - --extra-index-url https://download.pytorch.org/whl/cu132
    - torch==2.14.1
    - torchvision==0.29.1
    # Keras 3, used with the PyTorch backend (KERAS_BACKEND=torch)
    - keras==3.15.1
    - tensorboard
    - scikit-image==0.26.0
    - scikit-learn==1.9.1
    - numpy==2.5.5
    - tqdm
    - pandas
    - wget
    - gdown
    - opencv-python
  # Add more dependencies as needed
